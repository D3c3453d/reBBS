<!--signup.html-->
{% extends "base.html" %}
{% block title %}Register | reBBS{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="fullscreen d-flex justify-content-center align-items-center">
  <div class="auth-card">
    <h4 class="text-center mb-4">Create Account</h4>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
        <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" class="form-control{% if field.errors %} is-invalid{% endif %}"
          id="{{ field.id_for_label }}">
        {% if field.errors %}
        <div class="invalid-feedback d-block">{{ field.errors.0 }}</div>
        {% endif %}
      </div>
      {% endfor %}
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Sign Up</button>
      </div>
      <div class="text-center mt-3 small">
        <span class="text-muted">Already have an account? </span>
        <a href="{% url 'login' %}">Login</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
