<!--password_reset_complete.html-->
{% extends "base.html" %}
{% block title %}Register | reBBS{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="fullscreen d-flex justify-content-center align-items-center">
  <div class="auth-card">
    <h4 class="text-center mb-4">Password Reset Successful</h4>
    <p class="text-muted">
      Your password has been set. You can now log in with your new credentials.
    </p>
    <div class="d-grid mb-2">
      <a href="{% url 'login' %}" class="btn btn-primary mt-3">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
