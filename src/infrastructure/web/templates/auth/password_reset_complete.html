<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Reset Complete | reBBS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card-center {
      max-width: 400px;
      margin: auto;
      padding: 2rem;
      margin-top: 5rem;
      background: #fff;
      border-radius: .5rem;
      box-shadow: 0 .5rem 1rem rgba(0,0,0,0.1);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card-center">
      <h4 class="mb-3">Password Reset Successful</h4>
      <p class="text-muted">
        Your password has been set. You can now log in with your new credentials.
      </p>
      <a href="{% url 'login' %}" class="btn btn-primary mt-3">Back to Login</a>
    </div>
  </div>
</body>
</html>
