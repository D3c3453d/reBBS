<!--password_reset_done.html-->
{% extends "base.html" %}
{% block title %}Register | reBBS{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="fullscreen d-flex justify-content-center align-items-center">
  <div class="auth-card">
    <h4 class="text-center mb-4">Check Your Inbox</h4>
      <p class="text-muted">
        If an account exists with the email you entered, you will receive an email with instructions to reset your password.
      </p>
      <div class="d-grid mb-2">
        <a href="{% url 'login' %}" class="btn btn-outline-primary mt-3">Back to Login</a>
      </div>
  </div>
</div>
{% endblock %}
