<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ chat.name }} | reBBS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      padding-top: 80px;
      padding-bottom: 40px;
      min-height: 100vh;
    }
    .chat-card {
      max-width: 800px;
      margin: auto;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 200px);
      background: #fff;
      border-radius: .5rem;
      box-shadow: 0 .5rem 1rem rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .chat-log {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 1rem;
      background: #e9ecef;
    }
    .chat-input {
      flex: 0 0 auto;
      padding: 1rem;
      border-top: 1px solid #dee2e6;
      background: #fff;
    }
    .chat-message {
      max-width: 75%;
      padding: .5rem .75rem;
      margin: .5rem 0;
      border-radius: 1rem;
      word-break: break-word;
    }
    .user-message {
      background: #007bff;
      color: #fff;
      margin-left: auto;
    }
    .other-message {
      background: #f1f3f5;
      margin-right: auto;
    }
    .message-time {
      font-size: 0.75rem;
      opacity: .6;
      margin-top: .25rem;
      text-align: right;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-md navbar-light bg-white border-bottom fixed-top">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="{% url 'chats' %}">reBBS Chats</a>
      <span class="navbar-text h5 mb-0">{{ chat.name }}</span>
      <div class="d-flex align-items-center">
        <span id="connection-status" class="badge bg-success me-2">Online</span>
        {% if request.user.is_authenticated %}
          <form action="{% url 'logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
          </form>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Chat Card -->
  <div class="chat-card mt-4">
    <!-- Messages -->
    <div id="chat-log" class="chat-log">
      <!-- messages will be appended here -->
    </div>

    <!-- Typing Indicator -->
    <div id="typing-indicator" class="text-muted small px-3" style="display:none;">
      Someone is typing...
    </div>

    <!-- Input Area -->
    <div class="chat-input d-flex">
      <textarea id="chat-message-input"
                class="form-control me-2"
                rows="2"
                placeholder="Type a message..."
                style="resize: none;"></textarea>
      <button id="chat-message-submit" class="btn btn-primary">Send</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const chatId = "{{ chat.id }}";
    const userId = "{{ request.user.id }}";
    const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const endpoint = `${protocol}://${window.location.host}/ws/chat/${chatId}/`;
    let chatSocket;

    const log = document.getElementById('chat-log');
    const input = document.getElementById('chat-message-input');
    const button = document.getElementById('chat-message-submit');
    const statusBadge = document.getElementById('connection-status');

    function connect() {
      chatSocket = new WebSocket(endpoint);

      chatSocket.onopen = () => {
        statusBadge.className = 'badge bg-success me-2';
        statusBadge.textContent = 'Online';
      };

      chatSocket.onclose = () => {
        statusBadge.className = 'badge bg-danger me-2';
        statusBadge.textContent = 'Offline';
        setTimeout(connect, 5000);
      };

      chatSocket.onerror = e => {
        statusBadge.className = 'badge bg-warning me-2';
        statusBadge.textContent = 'Error';
      };

      chatSocket.onmessage = e => {
        const data = JSON.parse(e.data);
        addMessageToChat(data);
      };
    }

    function addMessageToChat(data) {
      const wrapper = document.createElement('div');
      const isUser = data.member_id == userId;
      wrapper.className = `chat-message ${isUser ? 'user-message' : 'other-message'}`;

      const content = document.createElement('div');
      content.textContent = data.content;
      wrapper.appendChild(content);

      const time = document.createElement('div');
      time.className = 'message-time';
      time.textContent = new Date(data.created_at).toLocaleTimeString();
      wrapper.appendChild(time);

      log.appendChild(wrapper);
      log.scrollTop = log.scrollHeight;
    }

    button.addEventListener('click', () => {
      const text = input.value.trim();
      if (!text) return;
      chatSocket.send(JSON.stringify({ type: 'message', content: text }));
      input.value = '';
    });

    input.addEventListener('keyup', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        button.click();
      }
    });

    connect();
  </script>
</body>
</html>
