<!DOCTYPE html>
<html lang="en">
  <head>
    <title></title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      body {
        text-align: center;
        margin: 0px auto;
      }
      body > div {
        margin-left: auto;
        margin-right: auto;
      }
    </style>
  </head>
  <body>
    <br />
    <h1 class="display-4">Hello, {{request.user}}!</h1>
    <br />
    {% if request.user.is_authenticated  %}
      <form action="{% url 'logout-user' %}" method="post" style="display:inline">
        {% csrf_token %}
        <label for="btn-logout"><button type="submit" id="btn-logout" class="btn btn-danger">Logout</button> the chat page</label>
      </form>
      <div
      class="col-sm-5"
      id="id_chat_item_container"
      >
      <br />
      <textarea
        class="form-control"
        id="id_message_send_input"
        placeholder="type here"
      ></textarea>
      <br />
      <button type="submit" id="id_message_send_button" class="btn btn-primary">Send Message</button>
      <br />
      <br />
    </div>
    {% endif %}
    <script>
      const chatSocket = new WebSocket("ws://" + window.location.host + "/");
      chatSocket.onopen = function (e) {
        console.log("The connection was setup successfully !");
      };
      chatSocket.onclose = function (e) {
        console.log("Something unexpected happened !");
      };
      document.querySelector("#id_message_send_input").focus();
      document.querySelector("#id_message_send_input").onkeyup = function (e) {
        if (e.keyCode == 13) {
          document.querySelector("#id_message_send_button").click();
        }
      };
      document.querySelector("#id_message_send_button").onclick = function (e) {
        var messageInput = document.querySelector(
          "#id_message_send_input"
        ).value;
        chatSocket.send(JSON.stringify({ message: messageInput, username : "{{request.user.username}}"}));
      };
      chatSocket.onmessage = function (e) {
        const data = JSON.parse(e.data);
        var div = document.createElement("div");
        div.innerHTML = data.username + " : " + data.message;
        document.querySelector("#id_message_send_input").value = "";
        document.querySelector("#id_chat_item_container").appendChild(div);
      };
    </script>
  </body>
</html>
