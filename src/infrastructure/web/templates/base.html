<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}reBBS{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #007bff;
      --bg-light: #f8f9fa;
      --card-radius: .75rem;
      --card-shadow: 0 .5rem 1rem rgba(0,0,0,0.1);
    }
    body { background-color: var(--bg-light); }
    .card-base {
      background: #fff;
      border: none;
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
    }
    .form-card, .chat-card, .list-card {
      margin-top: 5rem;
      padding: 2rem;
    }
    .navbar-brand { font-weight: 600; color: var(--primary) !important; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-light bg-white fixed-top border-bottom shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">reBBS Chats</a>
      <div class="ms-auto">
        {% if user.is_authenticated %}
          <span class="me-3">Hi, {{ user.username }}</span>
          <form action="{% url 'logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button class="btn btn-outline-danger btn-sm">Logout</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm me-2">Login</a>
          <a href="{% url 'signup' %}" class="btn btn-primary btn-sm">Sign Up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block script %}{% endblock %}
</body>
</html>
