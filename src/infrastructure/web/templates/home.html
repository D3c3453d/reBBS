<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome | reBBS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-md navbar-light bg-white border-bottom fixed-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'chats' %}">reBBS Chats</a>
    </div>
  </nav>

  <main class="container text-center d-flex flex-column justify-content-center align-items-center min-vh-100 pt-5">
    <h1 class="display-4 mb-3">Welcome to reBBS</h1>
    <p class="lead mb-4">A simple and elegant real-time chat system.</p>
    <div>
      {% if user.is_authenticated %}
        <a href="{% url 'chats' %}" class="btn btn-primary btn-lg">Enter Chats</a>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-success btn-lg me-2">Login</a>
        <a href="{% url 'signup' %}" class="btn btn-outline-primary btn-lg">Register</a>
      {% endif %}
    </div>
  </main>
</body>
</html>
